[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viroflow"
version = "0.2.0"
description = "Reproducible viral-genome workflow from raw reads to comparative antigenic screening"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tasnim Zarin", email = "tasnim.2001040@bau.edu.bd"}]
keywords = ["viral genomics", "genome assembly", "genotyping", "antigenic drift", "surveillance"]
dependencies = [
  "biopython>=1.83,<2",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/zarinT117/txapps"
Repository = "https://github.com/zarinT117/txapps"
Issues = "https://github.com/zarinT117/txapps/issues"

[project.optional-dependencies]
ml = ["joblib>=1.3,<2", "scikit-learn>=1.4,<2"]
dev = [
  "build>=1.2,<2",
  "joblib>=1.3,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "scikit-learn>=1.4,<2",
  "twine>=5,<7",
]

[project.scripts]
viroflow = "viroflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
